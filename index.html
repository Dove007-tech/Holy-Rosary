<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Holy Rosary Companion - Single Decade</title>
    <style>
        body { font-family: "Georgia", serif; background: linear-gradient(180deg, #E3F2FD 0%, #FFFFFF 50%, #BBDEFB 100%); color: #0D47A1; margin: 0; padding: 15px; text-align: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
        .panel, .card { background: rgba(255, 255, 255, 0.85); border: 2px solid #90CAF9; border-radius: 20px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(13, 71, 161, 0.1); }
        .card { background: #FFFFFF; border-color: #90CAF9; text-align: justify; }
        .app-title { font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 0; }
        .score-row { display: flex; justify-content: space-around; font-family: sans-serif; font-weight: 800; font-size: 13px; color: #1565C0; margin-top: 5px; }
        .card-title { font-size: 14px; font-weight: 800; color: #B71C1C; text-transform: uppercase; margin-bottom: 6px; text-align: center; }
        .card-text { font-size: 14px; color: #212121; margin: 0; white-space: pre-line; font-weight: 500; }
        .viewport { height: 230px; position: relative; margin-bottom: 12px; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #B3E5FC 0%, #E1F5FE 100%); border: 3px solid #90CAF9; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; }
        .mystery-banner { position: absolute; top: 12px; left: 12px; background: rgba(13, 71, 161, 0.85); color: #FFF; font-family: sans-serif; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px; z-index: 12; }
        .large-node { font-size: 38px; z-index: 10; margin-top: 10px; }
        .grid-10 { display: flex; justify-content: center; gap: 6px; width: 100%; z-index: 10; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 12px; box-sizing: border-box; }
        .bead { font-size: 24px; width: 30px; height: 34px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .bloom { animation: roseBloom 0.5s ease-out forwards; }
        @keyframes roseBloom { 0% { transform: scale(0.4); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 8px #FF5252); } }
        .gift-rose { position: absolute; font-size: 28px; animation: floatToMary 2.5s ease-in-out forwards; z-index: 25; bottom: 15px; }
        @keyframes floatToMary { 0% { bottom: 15px; left: var(--start-x); transform: scale(0.5); opacity: 1; } 100% { bottom: 130px; left: 50%; transform: translate(-50%, -50%) scale(1.2); opacity: 0; } }
        .trust { font-family: sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; margin: 5px 0 15px 0; color: #1565C0; opacity: 0.5; }
        .glow { opacity: 1; color: #0D47A1; text-shadow: 0 0 10px #B3E5FC; }
        .btn { width: 100%; background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%); color: #FFF; border: 3px solid #FFF; padding: 15px; border-radius: 30px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-bottom: 5px; }
        .selector-box { padding: 8px; font-size: 14px; font-family: "Georgia", serif; border-radius: 10px; border: 2px solid #90CAF9; width: 100%; margin-bottom: 12px; font-weight: bold; color: #0D47A1; background: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1 class="app-title">The Holy Rosary</h1>
            <div class="score-row">
                <div id="b-lbl">Bead Tracker: 1 / 17</div>
                <div id="s-lbl">Opening Prayers</div>
            </div>
        </div>

        <select id="mystery-picker" class="selector-box" onchange="changeMystery()">
            <option value="0">1st Sorrowful Mystery: Agony in the Garden</option>
            <option value="1">2nd Sorrowful Mystery: Scourging at the Pillar</option>
            <option value="2">3rd Sorrowful Mystery: Crowning with Thorns</option>
            <option value="3">4th Sorrowful Mystery: Carrying of the Cross</option>
            <option value="4">5th Sorrowful Mystery: The Crucifixion</option>
        </select>

        <div class="card">
            <div id="p-title" class="card-title">The Sign of the Cross</div>
            <p id="p-text" class="card-text">In the name of the Father, and of the Son, and of the Holy Spirit. Amen.</p>
        </div>
        <div class="viewport" id="viewport">
            <div id="mystery-node" class="mystery-banner">Opening Focus</div>
            <div style="display:flex; justify-content:center; width:100%;"><div id="l-node" class="large-node">👑</div></div>
            <div class="grid-10" id="matrix"></div>
        </div>
        <div id="t-node" class="trust">Holy Mary, Pray for Us!</div>
        <button class="btn" id="act-btn" onclick="prayStep()">Tap to Pray Next Bead</button>
        <button class="btn" style="background:#78909C; font-size:12px; padding:8px;" onclick="resetJourney()">Restart Decade</button>
    </div>
    <script>
        var step = 0; const MAX = 17; var grp = document.getElementById('matrix');
        var p1 = "Our Father, Who art in heaven, hallowed be Thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread and forgive us our trespasses as we forgive those who trespass against us. And lead us not into temptation, but deliver us from evil. Amen.";
        var p2 = "Hail Mary, full of grace, the Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen.";
        var p3 = "Glory be to the Father, and to the Son, and to the Holy Spirit. As it was in the beginning, is now, and ever shall be, world without end. Amen.\n\nFatima Prayer: O my Jesus, forgive us our sins, save us from the fires of hell. Lead all souls to heaven, especially those in most need of Thy mercy. Amen.";
        var p4 = "I believe in God, the Father Almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father Almighty; from there He will come to judge the living and the dead.\n\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen.";
        var p5 = "Hail, Holy Queen, Mother of Mercy, our life, our sweetness and our hope. To thee do we cry, poor banished children of Eve. To thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious advocate, thine eyes of mercy toward us, and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary! Pray for us, O Holy Mother of God, that we may be made worthy of the promises of Christ. Amen.";
        var mysteries = ["Agony in the Garden", "Scourging at the Pillar", "Crowning with Thorns", "Carrying of the Cross", "The Crucifixion"];
        var selectedMystery = "1st Mystery: " + mysteries[0];

        function changeMystery() {
            var idx = document.getElementById('mystery-picker').value;
            selectedMystery = (parseInt(idx) + 1) + "th Mystery: " + mysteries[idx];
            if (step >= 4 && step <= 14) { document.getElementById('mystery-node').innerText = selectedMystery; }
        }

        function getData(s) {
            if (s === 0) return { b: "👑", s: "Opening Prayers", t: "The Sign of the Cross", p: "In the name of the Father, and of the Son, and of the Holy Spirit. Amen.", lg: true, m: "Opening Focus" };
            if (s === 1) return { b: "📀", s: "Opening Prayers", t: "The Apostles' Creed", p: p4, lg: true, m: "Opening Focus" };
            if (s === 2) return { b: "👑", s: "Opening Prayers", t: "The Our Father", p: p1, lg: true, m: "Opening Intentions" };
            if (s === 3) return { b: "👑", s: "Sorrowful Decade", t: "The Our Father", p: p1, lg: true, m: selectedMystery };
            if (s >= 4 && s <= 13) return { b: "📀", s: "Sorrowful Decade", t: "Hail Mary - Bead " + (s - 3), p: p2, lg: false, m: selectedMystery };
            if (s === 14) return { b: "✨", s: "Sorrowful Decade", t: "Glory Be & Fatima Prayer", p: p3, lg: true, m: selectedMystery };
            if (s === 15) return { b: "👑", s: "Closing Prayers", t: "Hail, Holy Queen", p: p5, lg: true, m: "Offering Roses to Mary" };
            return { b: "👑", s: "Closing Prayers", t: "The Sign of the Cross", p: "In the name of the Father, and of the Son, and of the Holy Spirit. Amen.", lg: true, m: "Concluded" };
        }

        function drawMatrix() {
            grp.innerHTML = ''; var rem = (step >= 4 && step <= 13) ? (step - 3) : (step > 13 ? 10 : 0);
            for (var i = 1; i <= 10; i++) {
                var cell = document.createElement('div'); cell.className = 'bead';
                if (i <= rem) { cell.innerHTML = '🌹'; cell.className = 'bead bloom'; }
                else { cell.innerHTML = '📀'; }
                grp.appendChild(cell);
            }
        }

        function offerRoses() {
            var v = document.getElementById('viewport');
            for (var i = 0; i < 15; i++) {
                setTimeout((function(x) { return function() {
                    var p = document.createElement('div'); p.className = 'gift-rose'; p.innerHTML = '🌹';
                    p.style.setProperty('--start-x', (Math.random() * 80 + 10) + '%'); v.appendChild(p);
